<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#0f172a; --bg-soft:#1e293b; --card:#1e293b; --card-2:#263449;
    --line:#334155; --line-soft:#2b3a52;
    --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
    --accent:#38bdf8; --accent-dim:#0ea5e9;
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --violet:#a78bfa;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 72px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(15,23,42,.85); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:16px 20px;
  }
  .topbar-in{max-width:1080px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .topbar h1{margin:0;font-size:1.3rem;font-weight:650;letter-spacing:-.01em}
  .topbar .meta{margin:2px 0 0;color:var(--dim);font-size:.82rem}
  .controls{margin-inline-start:auto;display:flex;gap:8px}
  .btn{
    background:var(--card-2); color:var(--text); border:1px solid var(--line);
    padding:7px 14px; border-radius:999px; font-size:.82rem; font-family:inherit;
    cursor:pointer; transition:.15s;
  }
  .btn:hover{background:#31425c;border-color:#47597a}

  /* ---------- cards ---------- */
  .card{
    background:var(--card); border:1px solid var(--line-soft);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:22px 24px; margin:22px 0;
  }
  .card > h2{
    margin:0 0 14px; font-size:1.02rem; font-weight:650; letter-spacing:.01em;
    color:var(--muted); text-transform:none;
    display:flex; align-items:center; gap:9px;
  }
  .card > h2::before{
    content:""; width:4px; height:17px; border-radius:2px;
    background:var(--accent); flex:none;
  }
  .lede{font-size:1.03rem;line-height:1.85}
  .lede p{margin:0 0 12px}
  .lede p:last-child{margin-bottom:0}

  /* ---------- badges ---------- */
  .badge{
    display:inline-block; padding:2px 10px; border-radius:999px;
    font-size:.72rem; font-weight:600; line-height:1.6; white-space:nowrap;
    border:1px solid transparent;
  }
  .badge.new{color:var(--green);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3)}
  .badge.mod{color:var(--amber);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
  .badge.del{color:var(--red);background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3)}
  .badge.info{color:var(--accent);background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.3)}
  .badge.risk{color:var(--violet);background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.3)}

  /* ---------- mermaid ---------- */
  .diagram{
    background:var(--bg-soft); border:1px solid var(--line-soft);
    border-radius:10px; padding:18px; overflow-x:auto;
  }
  .diagram .mermaid{display:flex;justify-content:center;min-height:40px}
  .diagram svg{max-width:100%;height:auto}

  /* ---------- table ---------- */
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  thead th{
    text-align:start; font-weight:600; color:var(--muted);
    padding:10px 12px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{padding:12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  td.component{font-weight:600;white-space:nowrap}

  /* ---------- accordions ---------- */
  details{
    background:var(--card-2); border:1px solid var(--line-soft);
    border-radius:10px; margin:10px 0; overflow:hidden;
  }
  details[open]{border-color:var(--line)}
  summary{
    cursor:pointer; padding:13px 16px; font-weight:600; font-size:.95rem;
    list-style:none; display:flex; align-items:center; gap:10px;
    transition:background .15s;
  }
  summary:hover{background:rgba(255,255,255,.03)}
  summary::-webkit-details-marker{display:none}
  summary::before{
    content:"‹"; color:var(--dim); font-size:1.3rem; line-height:1;
    transition:transform .2s; flex:none; transform:rotate(0deg);
  }
  details[open] > summary::before{transform:rotate(-90deg); color:var(--accent)}
  .details-body{padding:2px 18px 18px; border-top:1px solid var(--line-soft); font-size:.94rem}
  .details-body > *:first-child{margin-top:14px}
  .details-body ol,.details-body ul{padding-inline-start:22px;margin:10px 0}
  .details-body li{margin:6px 0}
  .details-body h4{margin:16px 0 6px;font-size:.86rem;color:var(--muted);font-weight:650}

  /* ---------- code & files ---------- */
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.86em; background:rgba(148,163,184,.14); color:#bae6fd;
    padding:1.5px 6px; border-radius:5px; direction:ltr; display:inline-block;
  }
  pre{
    background:#0b1220; border:1px solid var(--line-soft); border-radius:9px;
    padding:13px 15px; overflow-x:auto; direction:ltr; text-align:left; margin:10px 0;
  }
  pre code{background:none;padding:0;color:#cbd5e1;font-size:.85rem;display:block}
  .filelist{list-style:none;padding:0;margin:10px 0}
  .filelist li{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:7px 0; border-bottom:1px dashed var(--line-soft);
  }
  .filelist li:last-child{border-bottom:none}
  .filelist .path{direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.84rem;color:#bae6fd}
  .filelist .why{color:var(--muted);font-size:.86rem}

  /* ---------- checklist ---------- */
  .checklist{list-style:none;padding:0;margin:0}
  .checklist li{
    display:flex; gap:11px; align-items:flex-start;
    padding:11px 0; border-bottom:1px solid var(--line-soft);
  }
  .checklist li:last-child{border-bottom:none}
  .checklist input[type=checkbox]{
    margin-top:6px; width:16px; height:16px; accent-color:var(--accent-dim); flex:none; cursor:pointer;
  }
  .checklist .c-label{font-weight:600;font-size:.93rem}
  .checklist .c-desc{color:var(--muted);font-size:.86rem;margin-top:2px}
  .checklist li:has(input:checked) .c-label{color:var(--dim);text-decoration:line-through}
  .cmd{
    display:block; direction:ltr; text-align:left; margin-top:7px;
    background:#0b1220; border:1px solid var(--line-soft); border-radius:7px;
    padding:8px 11px; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.82rem; color:#a5f3fc; overflow-x:auto; white-space:pre;
  }
  footer{color:var(--dim);font-size:.78rem;text-align:center;margin-top:36px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div>
      <h1>{{TITLE}}</h1>
      <p class="meta">{{META}}</p>
    </div>
    <div class="controls">
      <button class="btn" id="expandAll">פתח הכל</button>
      <button class="btn" id="collapseAll">סגור הכל</button>
    </div>
  </div>
</div>

<div class="wrap">

  <section class="card">
    <h2>תמצית מנהלים</h2>
    <div class="lede">{{SUMMARY}}</div>
  </section>

  <section class="card">
    <h2>תרשים זרימה</h2>
    <div class="diagram" dir="ltr">
      <pre class="mermaid">{{MERMAID}}</pre>
    </div>
  </section>

  <section class="card">
    <h2>מטריצת השפעה</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>רכיב</th><th>המצב כיום</th><th>מה ישתנה</th><th>סיבת השינוי</th></tr>
        </thead>
        <tbody>
{{IMPACT_ROWS}}
        </tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>פירוט מודולרי</h2>
{{MODULES}}
  </section>

  <section class="card">
    <h2>צעדי אימות ובדיקה</h2>
    <ul class="checklist">
{{VERIFICATION}}
    </ul>
  </section>

  <footer>{{FOOTER}}</footer>
</div>

<script src="./mermaid.min.js"></script>
<script>
  const diagramBox = document.querySelector('.diagram');
  const mermaidEl  = document.querySelector('.mermaid');
  const rawSource  = mermaidEl ? mermaidEl.textContent : '';

  function diagramFailed(msg) {
    diagramBox.innerHTML =
      '<p dir="rtl" style="color:#f87171;margin:0 0 10px">' + msg + '</p>' +
      '<pre style="margin:0"><code></code></pre>';
    diagramBox.querySelector('code').textContent = rawSource;
  }

  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      flowchart: { curve: 'basis', htmlLabels: true },
      themeVariables: {
        background: '#1e293b', primaryColor: '#263449',
        primaryTextColor: '#e2e8f0', primaryBorderColor: '#475569',
        lineColor: '#64748b', secondaryColor: '#334155', tertiaryColor: '#0f172a',
        fontFamily: 'system-ui, -apple-system, sans-serif'
      }
    });
    // Rendering can fail on a syntax slip. Showing the source beats an empty card.
    mermaid.run({ nodes: [mermaidEl] })
      .catch(e => diagramFailed('התרשים נכשל ברינדור: ' + (e && (e.str || e.message) || e)));
  } else {
    diagramFailed('קובץ mermaid.min.js לא נמצא לצד הדשבורד.');
  }

  const allDetails = () => document.querySelectorAll('details');
  document.getElementById('expandAll')
    .addEventListener('click', () => allDetails().forEach(d => d.open = true));
  document.getElementById('collapseAll')
    .addEventListener('click', () => allDetails().forEach(d => d.open = false));
</script>
</body>
</html>
